<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Available Kittens in Brooklyn</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5efe9;
      color: #292522;
    }

    header {
      padding: 38px 20px;
      text-align: center;
      background: white;
      border-bottom: 1px solid #eadfd6;
    }

    header h1 {
      margin: 0;
      font-size: 34px;
    }

    header p {
      margin: 10px 0 0;
      color: #746c66;
      font-size: 16px;
    }

    main {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 34px 18px 60px;
    }

    #kittens {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 26px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      overflow: hidden;
      background: white;
      border: 1px solid #e8ddd4;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(60, 45, 35, 0.12);
    }

    .media {
      position: relative;
      width: 100%;
      height: 330px;
      background: #eee5dc;
      overflow: hidden;
    }

    .photo {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .placeholder {
      display: flex;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #83766d;
      font-size: 18px;
    }

    .details {
      padding: 22px;
    }

    .name {
      margin: 0 0 7px;
      font-size: 28px;
    }

    .breed {
      margin: 0 0 12px;
      color: #5f5752;
      font-size: 17px;
    }

    .info {
      margin: 8px 0;
      color: #5f5752;
      font-size: 16px;
      line-height: 1.5;
    }

    .status {
      display: inline-block;
      margin-top: 6px;
      padding: 7px 13px;
      border-radius: 999px;
      background: #dff3e5;
      color: #28703c;
      font-size: 14px;
      font-weight: bold;
      text-transform: capitalize;
    }

    .price {
      margin: 16px 0 5px;
      font-size: 28px;
      font-weight: bold;
    }

    .deposit {
      margin: 0;
      color: #5f5752;
    }

    .location {
      margin: 17px 0 0;
      padding-top: 15px;
      border-top: 1px solid #eee5de;
      color: #6a625c;
    }

    .video-link {
      display: block;
      margin-top: 16px;
      padding: 11px 14px;
      text-align: center;
      text-decoration: none;
      background: #292522;
      color: white;
      border-radius: 10px;
      font-weight: bold;
    }

    #message {
      padding: 60px 20px;
      text-align: center;
      color: #746c66;
      font-size: 18px;
    }

    .error {
      color: #a32b2b !important;
    }

    footer {
      padding: 25px 15px;
      text-align: center;
      color: #81766e;
      font-size: 13px;
    }

    @media (max-width: 500px) {
      header {
        padding: 30px 15px;
      }

      header h1 {
        font-size: 28px;
      }

      main {
        padding: 24px 13px 45px;
      }

      .media {
        height: 310px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Available Kittens</h1>
    <p>Brooklyn, New York</p>
  </header>

  <main>
    <div id="message">Loading kittens...</div>
    <section id="kittens"></section>
  </main>

  <footer>
    Live kitten listings · Version 5
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://bcklzaganpupicvrccjd.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_IyNUNvRWCug0k8GsTcDvFg_0M6IqPyD";

    const { createClient } = window.supabase;

    const database = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    function createElement(tag, className, text) {
      const element = document.createElement(tag);

      if (className) {
        element.className = className;
      }

      if (text !== undefined && text !== null) {
        element.textContent = text;
      }

      return element;
    }

    function formatMoney(value) {
      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return "";
      }

      return Number(value).toLocaleString("en-US");
    }

    function formatDate(value) {
      if (!value) {
        return "";
      }

      const date = new Date(value + "T00:00:00");

      return date.toLocaleDateString("en-US", {
        month: "long",
        day: "numeric",
        year: "numeric"
      });
    }

    function capitalize(value) {
      if (!value) {
        return "";
      }

      return value.charAt(0).toUpperCase() + value.slice(1);
    }

    function renderKitten(kitten) {
      const card = createElement("article", "card");
      const media = createElement("div", "media");

      const placeholder = createElement(
        "div",
        "placeholder",
        "Kitten photo"
      );

      media.appendChild(placeholder);

      if (kitten.photo_url) {
        const image = document.createElement("img");

        image.className = "photo";
        image.alt = kitten.name || "Kitten";

        image.onload = function () {
          placeholder.style.display = "none";
        };

        image.onerror = function () {
          image.remove();
          placeholder.textContent = "Photo coming soon";
        };

        image.src = kitten.photo_url;
        media.appendChild(image);
      } else {
        placeholder.textContent = "Photo coming soon";
      }

      card.appendChild(media);

      const details = createElement("div", "details");

      details.appendChild(
        createElement(
          "h2",
          "name",
          kitten.name || "Kitten"
        )
      );

      if (kitten.breed) {
        details.appendChild(
          createElement("p", "breed", kitten.breed)
        );
      }

      const colorGender = [
        kitten.color,
        capitalize(kitten.gender)
      ]
        .filter(Boolean)
        .join(" • ");

      if (colorGender) {
        details.appendChild(
          createElement("p", "info", colorGender)
        );
      }

      if (kitten.date_of_birth) {
        details.appendChild(
          createElement(
            "p",
            "info",
            "Born " + formatDate(kitten.date_of_birth)
          )
        );
      }

      details.appendChild(
        createElement(
          "span",
          "status",
          kitten.status || "available"
        )
      );

      const price =
        kitten.selling_price ?? kitten.price;

      if (
        price !== null &&
        price !== undefined &&
        price !== ""
      ) {
        details.appendChild(
          createElement(
            "div",
            "price",
            "$" + formatMoney(price)
          )
        );
      }

      if (kitten.deposit_amount) {
        details.appendChild(
          createElement(
            "p",
            "deposit",
            "Deposit: $" +
              formatMoney(kitten.deposit_amount)
          )
        );
      }

      details.appendChild(
        createElement(
          "p",
          "location",
          kitten.location || "Brooklyn, New York"
        )
      );

      if (kitten.video_url) {
        const videoLink = createElement(
          "a",
          "video-link",
          "Watch video"
        );

        videoLink.href = kitten.video_url;
        videoLink.target = "_blank";
        videoLink.rel = "noopener noreferrer";

        details.appendChild(videoLink);
      }

      card.appendChild(details);

      return card;
    }

    async function loadKittens() {
      const message = document.getElementById("message");
      const container = document.getElementById("kittens");

      try {
        const { data, error } = await database
          .from("kittens")
          .select(
            "id,name,breed,color,gender,date_of_birth,status,selling_price,price,deposit_amount,location,photo_url,video_url,created_at"
          )
          .order("created_at", { ascending: false });

        if (error) {
          throw error;
        }

        if (!data || data.length === 0) {
          message.textContent =
            "No kittens are currently available.";
          return;
        }

        message.style.display = "none";
        container.innerHTML = "";

        data.forEach(function (kitten) {
          container.appendChild(renderKitten(kitten));
        });
      } catch (error) {
        console.error(error);

        message.classList.add("error");
        message.textContent =
          "The kittens could not be loaded.";
      }
    }

    loadKittens();
  </script>

</body>
</html>
