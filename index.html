<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Available Kittens in Brooklyn</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f6f1eb;
      color: #292929;
      font-family: Arial, Helvetica, sans-serif;
    }

    .top {
      padding: 38px 20px;
      text-align: center;
      background: #ffffff;
      border-bottom: 1px solid #e6ddd4;
    }

    .top h1 {
      margin: 0;
      font-size: 34px;
    }

    .top p {
      margin: 10px 0 0;
      color: #777;
      font-size: 16px;
    }

    .page {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 350px));
      justify-content: center;
      gap: 25px;
    }

    .card {
      width: 100%;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid #eadfd5;
      border-radius: 20px;
      box-shadow: 0 8px 28px rgba(60, 45, 35, 0.10);
    }

    .photo {
      display: block;
      width: 100%;
      height: 330px;
      object-fit: cover;
      background: #eee7df;
    }

    .details {
      padding: 22px;
    }

    .name {
      margin: 0 0 8px;
      font-size: 27px;
    }

    .breed {
      margin: 0 0 10px;
      color: #555;
      font-size: 17px;
    }

    .information {
      margin: 8px 0;
      color: #555;
      line-height: 1.5;
    }

    .status {
      display: inline-block;
      margin: 8px 0 4px;
      padding: 7px 13px;
      border-radius: 20px;
      background: #dff4e5;
      color: #26733b;
      font-size: 14px;
      font-weight: bold;
      text-transform: capitalize;
    }

    .price {
      margin: 14px 0 4px;
      font-size: 27px;
      font-weight: bold;
    }

    .deposit {
      margin: 4px 0;
      color: #555;
    }

    .location {
      margin: 14px 0 0;
      padding-top: 14px;
      border-top: 1px solid #eee4dc;
      color: #666;
    }

    .loading {
      padding: 60px 20px;
      text-align: center;
      color: #777;
      font-size: 18px;
    }

    .error {
      color: #a12626;
    }

    @media (max-width: 600px) {
      .top h1 {
        font-size: 28px;
      }

      .page {
        padding: 22px 14px 45px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .photo {
        height: 300px;
      }
    }
  </style>
</head>

<body>

  <header class="top">
    <h1>Available Kittens</h1>
    <p>Brooklyn, New York</p>
  </header>

  <main class="page">
    <div id="message" class="loading">Loading kittens...</div>
    <div id="kittens" class="grid"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://bcklzaganpupicvrccjd.supabase.co";

    const SUPABASE_KEY =
      sb_publishable_IyNUNvRWCug0k8GsTcDvFg_OM6IqPyD

    const db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    function formatDate(dateValue) {
      if (!dateValue) return "";

      const date = new Date(dateValue + "T00:00:00");

      return date.toLocaleDateString("en-US", {
        month: "long",
        day: "numeric",
        year: "numeric"
      });
    }

    function formatMoney(value) {
      if (value === null || value === undefined || value === "") {
        return "";
      }

      return Number(value).toLocaleString("en-US");
    }

    async function loadKittens() {
      const message = document.getElementById("message");
      const container = document.getElementById("kittens");

      const { data, error } = await db
        .from("kittens")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        message.classList.add("error");
        message.textContent = "Unable to load kittens.";
        console.error(error);
        return;
      }

      if (!data || data.length === 0) {
        message.textContent = "No kittens are currently available.";
        return;
      }

      message.style.display = "none";

      container.innerHTML = data.map(kitten => {
        const price =
          kitten.selling_price || kitten.price || "";

        const photo =
          kitten.photo_url ||
          "https://placehold.co/700x650/f0e8df/6d6259?text=Kitten+Photo";

        return `
          <article class="card">

            <img
              class="photo"
              src="${photo}"
              alt="${kitten.name || "Kitten"}"
              onerror="this.src='https://placehold.co/700x650/f0e8df/6d6259?text=Kitten+Photo'"
            >

            <div class="details">

              <h2 class="name">
                ${kitten.name || "Kitten"}
              </h2>

              <p class="breed">
                ${kitten.breed || ""}
              </p>

              <p class="information">
                ${kitten.color || ""}
                ${kitten.gender ? " • " + kitten.gender : ""}
              </p>

              ${
                kitten.date_of_birth
                  ? `
                    <p class="information">
                      Born ${formatDate(kitten.date_of_birth)}
                    </p>
                  `
                  : ""
              }

              <span class="status">
                ${kitten.status || "available"}
              </span>

              ${
                price
                  ? `
                    <div class="price">
                      $${formatMoney(price)}
                    </div>
                  `
                  : ""
              }

              ${
                kitten.deposit_amount
                  ? `
                    <p class="deposit">
                      Deposit: $${formatMoney(kitten.deposit_amount)}
                    </p>
                  `
                  : ""
              }

              <p class="location">
                ${kitten.location || "Brooklyn, New York"}
              </p>

            </div>
          </article>
        `;
      }).join("");
    }

    loadKittens();
  </script>

</body>
</html>
