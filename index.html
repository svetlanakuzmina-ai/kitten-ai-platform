<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Available Kittens in Brooklyn</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f1eb;
      color: #292522;
    }

    header {
      padding: 40px 20px;
      text-align: center;
      background: #ffffff;
      border-bottom: 1px solid #e8ded5;
    }

    header h1 {
      margin: 0;
      font-size: 36px;
    }

    header p {
      margin: 10px 0 0;
      color: #746c66;
      font-size: 16px;
    }

    main {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 35px 18px 60px;
    }

    #kittens {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 26px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid #e7dcd3;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(55, 40, 30, 0.12);
    }

    .media {
      width: 100%;
      height: 330px;
      background: #eee5dc;
      overflow: hidden;
    }

    .photo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .placeholder {
      display: flex;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #83766d;
      font-size: 18px;
    }

    .details {
      padding: 22px;
    }

    .name {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .breed {
      margin: 0 0 12px;
      color: #5f5752;
      font-size: 17px;
    }

    .info {
      margin: 8px 0;
      color: #5f5752;
      font-size: 16px;
      line-height: 1.5;
    }

    .status {
      display: inline-block;
      margin-top: 7px;
      padding: 7px 14px;
      border-radius: 999px;
      background: #dff3e5;
      color: #28703c;
      font-size: 14px;
      font-weight: bold;
      text-transform: capitalize;
    }

    .price {
      margin: 16px 0 5px;
      font-size: 29px;
      font-weight: bold;
    }

    .deposit {
      margin: 0;
      color: #5f5752;
    }

    .location {
      margin: 18px 0 0;
      padding-top: 15px;
      border-top: 1px solid #eee5de;
      color: #6a625c;
    }

    .video-link {
      display: block;
      margin-top: 16px;
      padding: 12px 15px;
      text-align: center;
      text-decoration: none;
      background: #292522;
      color: #ffffff;
      border-radius: 11px;
      font-weight: bold;
    }

    #message {
      padding: 60px 20px;
      text-align: center;
      color: #746c66;
      font-size: 18px;
    }

    #message.error {
      color: #a32b2b;
    }

    footer {
      padding: 25px 15px;
      text-align: center;
      color: #81766e;
      font-size: 13px;
    }

    @media (max-width: 500px) {
      header {
        padding: 30px 15px;
      }

      header h1 {
        font-size: 29px;
      }

      main {
        padding: 24px 13px 45px;
      }

      .media {
        height: 310px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Available Kittens</h1>
    <p>Brooklyn, New York</p>
  </header>

  <main>
    <div id="message">Loading kittens...</div>
    <section id="kittens"></section>
  </main>

  <footer>
    Live kitten listings · Version 6
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://bcklzaganpupicvrccjd.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_IyNUNvRWCug0k8GsTcDvFg_0M6IqPyD";

    const database = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    function formatMoney(value) {
      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return "";
      }

      return Number(value).toLocaleString("en-US");
    }

    function formatDate(value) {
      if (!value) {
        return "";
      }

      const date = new Date(value + "T00:00:00");

      return date.toLocaleDateString("en-US", {
        month: "long",
        day: "numeric",
        year: "numeric"
      });
    }

    function capitalize(value) {
      if (!value) {
        return "";
      }

      return (
        value.charAt(0).toUpperCase() +
        value.slice(1)
      );
    }

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);

      if (className) {
        element.className = className;
      }

      if (text !== undefined && text !== null) {
        element.textContent = text;
      }

      return element;
    }

    function createKittenCard(kitten) {
      const card = makeElement("article", "card");

      const media = makeElement("div", "media");

      if (kitten.photo_url) {
        const image = document.createElement("img");

        image.className = "photo";
        image.alt = kitten.name || "Kitten";
        image.src = kitten.photo_url;

        image.onerror = function () {
          media.innerHTML = "";

          media.appendChild(
            makeElement(
              "div",
              "placeholder",
              "Photo coming soon"
            )
          );
        };

        media.appendChild(image);
      } else {
        media.appendChild(
          makeElement(
            "div",
            "placeholder",
            "Photo coming soon"
          )
        );
      }

      card.appendChild(media);

      const details = makeElement("div", "details");

      details.appendChild(
        makeElement(
          "h2",
          "name",
          kitten.name || "Kitten"
        )
      );

      if (kitten.breed) {
        details.appendChild(
          makeElement(
            "p",
            "breed",
            kitten.breed
          )
        );
      }

      const colorAndGender = [
        kitten.color,
        capitalize(kitten.gender)
      ]
        .filter(Boolean)
        .join(" • ");

      if (colorAndGender) {
        details.appendChild(
          makeElement(
            "p",
            "info",
            colorAndGender
          )
        );
      }

      if (kitten.date_of_birth) {
        details.appendChild(
          makeElement(
            "p",
            "info",
            "Born " +
              formatDate(kitten.date_of_birth)
          )
        );
      }

      details.appendChild(
        makeElement(
          "span",
          "status",
          kitten.status || "available"
        )
      );

      const price =
        kitten.selling_price ??
        kitten.price;

      if (
        price !== null &&
        price !== undefined &&
        price !== ""
      ) {
        details.appendChild(
          makeElement(
            "div",
            "price",
            "$" + formatMoney(price)
          )
        );
      }

      if (
        kitten.deposit_amount !== null &&
        kitten.deposit_amount !== undefined &&
        kitten.deposit_amount !== ""
      ) {
        details.appendChild(
          makeElement(
            "p",
            "deposit",
            "Deposit: $" +
              formatMoney(kitten.deposit_amount)
          )
        );
      }

      details.appendChild(
        makeElement(
          "p",
          "location",
          kitten.location ||
            "Brooklyn, New York"
        )
      );

      if (kitten.video_url) {
        const videoLink = makeElement(
          "a",
          "video-link",
          "Watch video"
        );

        videoLink.href = kitten.video_url;
        videoLink.target = "_blank";
        videoLink.rel = "noopener noreferrer";

        details.appendChild(videoLink);
      }

      card.appendChild(details);

      return card;
    }

    async function loadKittens() {
      const message =
        document.getElementById("message");

      const container =
        document.getElementById("kittens");

      try {
        const { data, error } = await database
          .from("kittens")
          .select("*");

        if (error) {
          throw error;
        }

        if (!data || data.length === 0) {
          message.textContent =
            "No kittens are currently available.";

          return;
        }

        data.sort(function (a, b) {
          return String(b.created_at || "")
            .localeCompare(
              String(a.created_at || "")
            );
        });

        message.style.display = "none";
        container.innerHTML = "";

        data.forEach(function (kitten) {
          container.appendChild(
            createKittenCard(kitten)
          );
        });
      } catch (error) {
        console.error(error);

        message.classList.add("error");

        message.textContent =
          "Loading error: " +
          (error.message || "Unknown error");
      }
    }

    loadKittens();
  </script>

</body>
</html>
