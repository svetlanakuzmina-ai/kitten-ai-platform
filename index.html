<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Available Kittens</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f4ef;
      color: #2f2f2f;
    }

    header {
      background: white;
      padding: 25px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    .kitten-image {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
      background: #eee;
    }

    .status {
      display: inline-block;
      padding: 5px 11px;
      border-radius: 20px;
      background: #dff5e5;
      color: #26733b;
      font-size: 13px;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      margin: 12px 0;
    }

    #message {
      text-align: center;
      padding: 30px;
    }
  </style>
</head>

<body style="background:#f7f4ef; font-family:Arial,sans-serif; color:#2f2f2f;">

  <header>
    <h1>Available Kittens</h1>
    <p>Brooklyn, New York</p>
  </header>

  <main class="container">
    <div id="message">Loading kittens...</div>
    <div id="kittens" class="grid"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://bcklzaganpupicvrccjd.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_IyNUNvRWCug0k8GsTcDvFg_OM6IqPyD";

    const db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function loadKittens() {
      const message = document.getElementById("message");
      const container = document.getElementById("kittens");

      const { data, error } = await db
        .from("kittens")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        message.textContent = "Unable to load kittens.";
        console.error(error);
        return;
      }

      if (!data || data.length === 0) {
        message.textContent = "No kittens are currently available.";
        return;
      }

      message.style.display = "none";

      container.innerHTML = data.map(kitten => `
        <article class="card">
          ${
            kitten.photo_url
              ? `<img class="kitten-image"
                     src="${kitten.photo_url}"
                     alt="${kitten.name || "Kitten"}">`
              : ""
          }

          <h2>${kitten.name || "Kitten"}</h2>

          <p>${kitten.breed || ""}</p>

          <p>
            ${kitten.color || ""}
            ${kitten.gender ? " • " + kitten.gender : ""}
          </p>

          ${
            kitten.date_of_birth
              ? `<p>Born: ${kitten.date_of_birth}</p>`
              : ""
          }

          <span class="status">
            ${kitten.status || "available"}
          </span>

          <div class="price">
            $${kitten.selling_price || kitten.price || ""}
          </div>

          ${
            kitten.deposit_amount
              ? `<p>Deposit: $${kitten.deposit_amount}</p>`
              : ""
          }

          <p>${kitten.location || "Brooklyn, New York"}</p>
        </article>
      `).join("");
    }

    loadKittens();
  </script>

</body>
</html>
